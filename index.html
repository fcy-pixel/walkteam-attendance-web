<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歸程隊 點名</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e3a5f'/><text x='50' y='64' text-anchor='middle' font-family='Arial' font-size='40' font-weight='700' fill='white'>WT</text></svg>">
  <link rel="stylesheet" href="style.css?v=20260909-activity-filter">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ═══ Login Screen ═══ -->
<div id="login-screen">
  <div class="login-box home-box">
    <div class="home-brand">
      <div class="login-icon"><img src="school-logo.png" alt="基慈學校校章"></div>
      <div>
        <h2>歸程隊</h2>
        <p class="login-sub">學生點名及通報</p>
      </div>
    </div>

    <section class="home-ai-card" aria-labelledby="home-ai-title">
      <div class="home-section-head">
        <div>
          <h3 id="home-ai-title">每日缺席及早退名單</h3>
          <p>輸入姓名清單，同時配對 A、B、C 三隊。核對後可標記為不跟歸程隊。</p>
        </div>
      </div>
      <div class="attendance-names-form">
        <label for="attendance-list-type">通報類別</label>
        <select id="attendance-list-type" class="select-field">
          <option value="absent">缺席</option>
          <option value="early_leave">早退</option>
        </select>
        <label for="attendance-names">學生姓名清單</label>
        <textarea id="attendance-names" class="input-field" rows="5" maxlength="20000" placeholder="陳大文&#10;李小明" aria-describedby="attendance-names-help"></textarea>
        <p id="attendance-names-help">一行一個姓名，或用逗號、頓號分隔。英文姓名可保留空格。</p>
      </div>
      <button class="btn-primary full-width ai-analyze-btn" id="process-attendance-list-btn" disabled>配對 A、B、C 三隊</button>
      <div id="attendance-import-preview" aria-live="polite" style="display:none"></div>
    </section>

    <section class="home-team-card" aria-labelledby="home-team-title">
      <div class="home-team-copy">
        <h3 id="home-team-title">進入個別隊伍點名</h3>
        <p>如需點名或查看紀錄，請選擇隊伍。</p>
      </div>
      <div class="home-team-controls">
        <select id="login-team" aria-label="選擇歸程隊">
          <option value="A" selected>歸程隊A隊</option>
          <option value="B">歸程隊B隊</option>
          <option value="C">歸程隊C隊</option>
        </select>
        <button id="login-btn" class="btn-primary">進入</button>
      </div>
    </section>
    <section id="pending-home" class="pending-panel" aria-live="polite" hidden></section>
  </div>
</div>

<!-- ═══ Main App ═══ -->
<div id="app" style="display:none">

  <!-- Header -->
  <div class="header-row">
    <div id="header-card" class="header-card">
      <div class="header-left">
        <div class="header-kicker">學生歸程管理</div>
        <div class="header-title"><span id="header-team-label">歸程隊C隊</span> 點名系統</div>
        <div class="header-date" id="header-date"></div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="header-progress" style="width:0%"></div>
        </div>
        <div class="header-pct" id="header-pct">出席率 0%</div>
      </div>
      <div class="header-right">
        <div class="header-count"><span id="header-present">0</span><span class="header-total">/<span id="header-total">0</span></span></div>
        <div class="header-count-label">已到 / 總人數</div>
        <div id="header-skipped-badge" style="display:none"></div>
      </div>
    </div>
    <button class="refresh-btn" id="refresh-btn" title="檢查同步狀態" aria-label="檢查同步狀態">更新</button>
  </div>

  <!-- Clock -->
  <div class="clock-bar">
    <div class="clock" id="hkt-clock">--:--:--</div>
    <div class="clock-label">香港時間 HKT</div>
    <div id="sync-status" class="sync-status connecting" role="status" aria-live="polite">正在連線…</div>
  </div>

  <section id="pending-app" class="pending-panel" aria-live="polite" hidden></section>

  <!-- Tab Bar -->
  <div class="tab-bar" id="tab-bar">
    <button class="tab active" data-tab="list">今日名單</button>
    <button class="tab" data-tab="history">歷史紀錄</button>
    <button class="tab" data-tab="settings">設定</button>
  </div>

  <!-- ═══ Tab: 今日名單 ═══ -->
  <div id="tab-list" class="tab-content">
    <div id="list-empty" style="display:none" class="info-box">雲端尚無學生資料，請前往「設定」上傳 CSV 名單。</div>
    <div id="list-content">
      <div class="filter-row list-filter-row">
        <input type="text" id="list-search" placeholder="搜尋班級或姓名…" class="input-field list-filter-search">
        <select id="list-grade-filter" class="select-field list-filter-control" aria-label="篩選年級">
          <option value="">所有年級</option>
          <option value="1">一年級</option>
          <option value="2">二年級</option>
          <option value="3">三年級</option>
          <option value="4">四年級</option>
          <option value="5">五年級</option>
          <option value="6">六年級</option>
        </select>
        <select id="list-class-filter" class="select-field list-filter-control" aria-label="篩選班別">
          <option value="">所有班別</option>
        </select>
        <select id="list-activity-filter" class="select-field list-filter-control" aria-label="篩選今日活動">
          <option value="all">全部活動狀況</option>
          <option value="with">有活動</option>
          <option value="without">沒有活動</option>
        </select>
        <select id="list-filter" class="select-field list-filter-control" aria-label="篩選出席狀態">
          <option value="all">全部</option>
          <option value="absent">未到</option>
          <option value="present">已到</option>
          <option value="skipped">不跟歸程隊</option>
        </select>
      </div>
      <div id="list-stats"></div>
      <div id="list-cards"></div>
    </div>
  </div>

  <!-- ═══ Tab: 歷史紀錄 ═══ -->
  <div id="tab-history" class="tab-content" style="display:none">
    <div id="history-empty" class="info-box" style="display:none">尚無任何歷史紀錄。</div>
    <div id="history-content">
      <div class="filter-row">
        <select id="history-date" class="select-field" style="flex:3"></select>
        <button class="btn-outline" id="history-export-btn" style="flex:1">匯出紀錄</button>
      </div>
      <div id="history-summary"></div>
      <div id="history-cards"></div>
    </div>
  </div>

  <!-- ═══ Tab: 設定 ═══ -->
  <div id="tab-settings" class="tab-content" style="display:none">
    <h3>下載現有名單</h3>
    <button class="btn-primary full-width" id="export-students-btn">下載現有雲端名單 (CSV)</button>

    <hr>
    <h3>上傳或更新雲端名單</h3>
    <p class="caption">欄位：班級、學號、姓名、跟隨兄/姊回家、星期一～五。</p>
    <button class="btn-outline full-width" id="download-template-btn">下載名單範本 (CSV)</button>
    <div class="upload-area" id="upload-area">
      <input type="file" id="csv-upload" accept=".csv" style="display:none">
      <button class="btn-outline full-width" id="choose-csv-btn">選擇 CSV 檔案</button>
    </div>
    <div id="csv-preview" style="display:none">
      <div id="csv-preview-info" class="info-box"></div>
      <div id="csv-preview-table-wrap"></div>
      <button class="btn-primary full-width" id="csv-upload-confirm-btn">確認上傳至雲端</button>
    </div>

    <hr>
    <h3>系統</h3>
    <button class="btn-outline full-width" id="logout-btn">登出系統</button>

  </div>

</div>

<script type="module" src="app.js?v=20260924-roster-activities"></script>
</body>
</html>
